font_family      FiraCode Nerd Font Reg
#font_family      JetBrainsMonoNL Nerd Font Propo
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

enable_audio_bell no
hide_window_decoration yes
# Make neovim background transparent
transparent_background_colors #1a1b26
background_opacity 0.75
term xterm-256color

# font_features    SauceCodeProNFM +liga
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
#
include dank-tabs.conf
startup_session launch.conf
